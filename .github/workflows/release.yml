name: release

# Publishes a GitHub release for any pushed tag, carrying the Windows installer,
# the Linux .deb, the macOS .pkg and .dmg, and the Android APK.
#
# This workflow does not build anything: it reuses the artifacts the four
# build_* workflows already produced for the tagged commit. So the tagged commit
# must have green runs of build_pc_client.yml, build_linux_client.yml,
# build_macos_client.yml and build_android_client.yml before the tag is pushed -
# merge to main, wait for the builds, then tag that commit. Every download is
# pinned to the commit the released tag points at, so a commit without those runs
# fails here and publishes nothing.
#
# Dispatching manually: the "Use workflow from" dropdown only chooses which copy of
# this file runs. What gets released is the `tag` input, so set it - leaving it blank
# releases the dropdown's ref under its own name.
#
# If the `tag` input names a tag that doesn't exist yet, it is created here at the
# current HEAD of main and pushed, so a release can be cut without a separate manual
# `git tag && git push` step first. This does NOT relax the requirement above: main's
# HEAD still needs green build_* runs, or the download steps below fail as usual.
# Creating the tag also satisfies the push-tags trigger below, so the same release
# runs a second time for that tag; the concurrency group keys on the tag so that run
# queues behind this one instead of racing it for the same release assets.
#
# The macOS package is taken signed when the build had the Apple credentials and
# unsigned when it did not; an unsigned one is released with a note in the body
# telling users to clear the quarantine flag.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (defaults to the ref this workflow runs on). If it doesn't exist yet, it is created at main's HEAD."
        required: false
  push:
    tags:
      # "**" rather than "*" so tags containing a slash (release/1.0) match too.
      - "**"

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write   # create and update the release, and upload its assets
      actions: read     # list the runs and artifacts of the build_* workflows

    steps:
    # Only fires on manual dispatch of a named tag - a tag-push trigger means the tag
    # already exists by definition, and a blank `tag` input falls back to releasing
    # the dropdown's ref under its own name (see the comment above), which isn't a
    # real tag to create.
    #
    # main is hard-coded rather than the dispatched ref deliberately: this creates
    # a release tag, and those should only ever point at main, regardless of which
    # branch the "Use workflow from" dropdown happened to be set to.
    - name: Create the tag at main's HEAD if it doesn't exist yet
      if: github.event_name == 'workflow_dispatch' && inputs.tag != ''
      shell: bash
      env:
        GH_TOKEN: ${{github.token}}
        TAG: ${{ inputs.tag }}
      run: |
        set -euo pipefail
        if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
          echo "$TAG already exists - releasing it as-is."
          exit 0
        fi
        main_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
        echo "$TAG does not exist yet - creating it at main's HEAD ($main_sha)"
        gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$main_sha"

    # github.sha is NOT the commit being released. On workflow_dispatch it is the head of
    # whatever ref the "Use workflow from" dropdown selected, which has nothing to do with
    # the `tag` input - dispatching against main while asking for tag v2.0 would otherwise
    # download main's artifacts and publish them under v2.0, with the cross-check below
    # comparing them against main's SHA and happily agreeing. So the tag is resolved to its
    # commit once, here, and everything downstream keys off that.
    #
    # On a tag push, inputs.tag is empty and github.ref_name is the tag, so this resolves to
    # the same commit github.sha already held; the two triggers stay consistent.
    - name: Resolve the commit being released
      id: target
      shell: bash
      env:
        GH_TOKEN: ${{github.token}}
        REF: ${{ inputs.tag || github.ref_name }}
      run: |
        set -euo pipefail
        # This endpoint dereferences annotated tags, so it yields the commit either way.
        sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$REF" --jq .sha)"
        echo "releasing $REF at $sha"
        echo "sha=$sha" >> "$GITHUB_OUTPUT"

    # Each artifact carries its own release_notes.md and teleport_commit.properties,
    # so they are unpacked into separate directories to stop the three copies
    # overwriting each other.
    #
    # No github_token on the four downloads, and no token on the release step: every
    # one of them acts on this same repository, so the automatic GITHUB_TOKEN with the
    # permissions above suffices. A custom PAT here only invites "Bad credentials"
    # 401s when it expires.
    - name: Download Windows installer
      uses: dawidd6/action-download-artifact@v6
      with:
        workflow: build_pc_client.yml
        workflow_conclusion: success
        commit: ${{steps.target.outputs.sha}}
        name: installer
        path: dist/windows
        if_no_artifact_found: fail

    - name: Download Linux installer
      uses: dawidd6/action-download-artifact@v6
      with:
        workflow: build_linux_client.yml
        workflow_conclusion: success
        commit: ${{steps.target.outputs.sha}}
        name: linux-installer
        path: dist/linux
        if_no_artifact_found: fail

    # build_macos_client.yml uploads "macos-installer" when the Apple signing secrets
    # were available to the run and "macos-installer-unsigned" when they were not, so
    # the two are tried in that order: a signed package is always preferred, and an
    # unsigned one is accepted rather than blocking the release. `warn` instead of
    # `fail` lets the first step come up empty without ending the job.
    - name: Download macOS installer (signed)
      uses: dawidd6/action-download-artifact@v6
      with:
        workflow: build_macos_client.yml
        workflow_conclusion: success
        commit: ${{steps.target.outputs.sha}}
        name: macos-installer
        path: dist/macos
        if_no_artifact_found: warn

    # Tested by looking at what landed on disk rather than at an action output, so
    # this does not depend on the download action's reporting.
    - name: Check for a signed macOS package
      id: macos
      shell: bash
      run: |
        set -euo pipefail
        if compgen -G "dist/macos/*.pkg" > /dev/null; then
          echo "signed=true" >> "$GITHUB_OUTPUT"
        else
          echo "signed=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Download macOS installer (unsigned fallback)
      if: steps.macos.outputs.signed != 'true'
      uses: dawidd6/action-download-artifact@v6
      with:
        workflow: build_macos_client.yml
        workflow_conclusion: success
        commit: ${{steps.target.outputs.sha}}
        name: macos-installer-unsigned
        path: dist/macos
        if_no_artifact_found: fail

    - name: Download Android APK
      uses: dawidd6/action-download-artifact@v6
      with:
        workflow: build_android_client.yml
        workflow_conclusion: success
        commit: ${{steps.target.outputs.sha}}
        name: android-apk
        path: dist/android
        if_no_artifact_found: fail

    - name: Verify release assets
      shell: bash
      # if_no_artifact_found catches a missing artifact, but not an artifact that
      # uploaded without its installer: build_pc_client.yml uploads with
      # `if: always()`, so a run whose Installer step failed still yields an
      # "installer" artifact holding nothing but the NSIS logs.
      env:
        TARGET_SHA: ${{steps.target.outputs.sha}}
      run: |
        set -euo pipefail
        ls -R dist
        for pattern in "dist/windows/*.exe" "dist/linux/*.deb" "dist/macos/*.pkg" "dist/macos/*.dmg" "dist/android/*.apk"; do
          if ! compgen -G "$pattern" > /dev/null; then
            echo "::error::No file matching $pattern - refusing to publish an incomplete release."
            exit 1
          fi
        done
        # Cross-check that the artifacts really are the tagged commit's build. Compared
        # against the resolved TARGET_SHA, not GITHUB_SHA - on a dispatch the latter is
        # the dropdown's ref, so it would agree with the wrong artifacts.
        # teleport_commit.properties holds an abbreviated hash, so test it as a
        # prefix of the full SHA rather than comparing for equality.
        actual="$(sed -n 's/^TELEPORT_COMMIT=//p' dist/windows/teleport_commit.properties | tr -d ' \r\n')"
        echo "releasing commit $TARGET_SHA, artifact commit $actual"
        case "$TARGET_SHA" in
          "$actual"*) ;;
          *) echo "::error::Artifacts are from commit $actual, but the release points at $TARGET_SHA." ; exit 1 ;;
        esac

    - name: Rename release assets to the released tag
      shell: bash
      env:
        TAG: ${{ inputs.tag || github.ref_name }}
      run: |
        set -euo pipefail
        # Tags may contain slashes (release/1.0); sanitise for use in a filename.
        safe_tag="${TAG//\//-}"
        mv dist/windows/*.exe "dist/windows/TeleportClientInstaller-${safe_tag}-x64.exe"
        mv dist/linux/*.deb   "dist/linux/teleportxr-${safe_tag}-x64.deb"
        mv dist/macos/*.pkg   "dist/macos/teleportxr-${safe_tag}-arm64.pkg"
        mv dist/macos/*.dmg   "dist/macos/TeleportMacClientInstaller-${safe_tag}-arm64.dmg"
        mv dist/android/*.apk "dist/android/teleportxr-${safe_tag}.apk"

    # The release body so far is just the commit message that build_pc_client.yml
    # wrote into release_notes.md. The installation instructions are versioned in
    # the repo (Installers/release_instructions.md) rather than inline here, so the
    # tag being released is checked out and its copy of the file is appended -
    # each release shows the instructions as of that tag. clean: false because
    # checkout's default clean runs git clean -ffdx, which would delete the
    # untracked dist/ tree holding the downloaded assets.
    - name: Check out the released tag
      uses: actions/checkout@v4
      with:
        ref: ${{ inputs.tag || github.ref_name }}
        clean: false

    - name: Append the installation instructions
      shell: bash
      run: |
        set -euo pipefail
        {
          echo ""
          cat Installers/release_instructions.md
        } >> dist/windows/release_notes.md

    # Gatekeeper refuses an unsigned package outright, with an error that does not
    # explain itself, so the release notes have to say so and give the way round it.
    # Kept after the instructions so the warning is the last thing the reader sees.
    - name: Note the unsigned macOS package
      if: steps.macos.outputs.signed != 'true'
      shell: bash
      run: |
        set -euo pipefail
        echo "::warning::No signed macOS package for this commit - releasing the unsigned build. See docs/macos_signing_secrets.md."
        {
          echo ""
          echo "## macOS package is unsigned"
          echo ""
          echo "This release's \`.pkg\` was built without Apple signing credentials, so it is"
          echo "neither signed nor notarised. macOS will refuse to open it until the quarantine"
          echo "flag is cleared:"
          echo ""
          echo '```bash'
          echo "xattr -d com.apple.quarantine teleportxr-*.pkg"
          echo '```'
        } >> dist/windows/release_notes.md

    - name: Create Release
      uses: ncipollo/release-action@v1.14.0
      with:
        tag: ${{ inputs.tag || github.ref_name }}
        artifacts: "dist/windows/*.exe,dist/linux/*.deb,dist/macos/*.pkg,dist/macos/*.dmg,dist/android/*.apk"
        bodyFile: "dist/windows/release_notes.md"
        # Re-running repairs a release published with a broken or partial asset
        # set, rather than silently doing nothing as skipIfReleaseExists did.
        allowUpdates: true
        replacesArtifacts: true
        artifactErrorsFailBuild: true
